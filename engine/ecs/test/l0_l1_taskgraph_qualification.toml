version = 2
benchmark_schema_version = 4

# Thresholds remain external qualification policy. This closure pass does not
# publish qualification evidence or promote the performance state.

[[scaling]]
name = "TaskGraph independent execution scaling"
metric = "task_graph_execute_none"
small_size = 16
large_size = 1024
max_exponent = 1.25

[[scaling]]
name = "WorldChangeBatch one-lane recording scaling"
metric = "world_change_batch_record_1"
small_size = 100000
large_size = 1000000
max_exponent = 1.25

[[scaling]]
name = "WorldChangeBatch thirty-two-lane recording scaling"
metric = "world_change_batch_record_32"
small_size = 100000
large_size = 1000000
max_exponent = 1.25

[[scaling]]
name = "WorldSection load into 1M resident EcsState scaling"
metric = "world_section_load_commit_live_resident"
small_size = 1000
large_size = 10000
max_exponent = 1.25

[[structural]]
