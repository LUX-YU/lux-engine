name: deb

# Builds the lux-engine RUNTIME tier (LUX_BUILD_EDITOR=OFF) as per-layer .debs
# (lux-engine-platform/core/resource/function), amd64 + arm64. LUX deps come from
# the LUX apt repo; the rest from Ubuntu. The external-dep list below is a first
# pass — expect to iterate (EnTT/meshoptimizer/spirv-cross/shaderc availability
# on jammy is uncertain; missing ones get packaged into lux-apt or fixed in code).
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     arch: amd64 }
          - { runner: ubuntu-22.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: lux-engine

      - name: Add LUX apt repo
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://lux-yu.github.io/lux-apt/lux-archive-keyring.asc \
            | sudo tee /etc/apt/keyrings/lux.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/lux.asc] https://lux-yu.github.io/lux-apt jammy main" \
            | sudo tee /etc/apt/sources.list.d/lux.list

      - name: Install deps
        run: >
          sudo apt-get update && sudo apt-get install -y
          cmake ninja-build g++ dpkg-dev pkg-config
          libeigen3-dev libglfw3-dev libvulkan-dev libassimp-dev libluajit-5.1-dev
          libspirv-cross-c-shared-dev libstb-dev
          libclang-dev libfmt-dev sol2
          lux-cmake-toolset lux-cxx imgui stduuid entt vulkanmemoryallocator

      # shaderc isn't packaged for Ubuntu 22.04 (it lands in 24.04's libshaderc-dev)
      # and LunarG's SDK apt repo is amd64-only, so build it from source. It's slow,
      # so the install tree is cached (keyed on version+arch): the first run builds
      # (~10 min), later runs restore in seconds. Installed to /usr so asset's
      # find_package(Vulkan COMPONENTS shaderc_combined) picks up the STATIC
      # libshaderc_combined.a — baked into asset.so, keeping the .deb self-contained
      # (shaderc is PRIVATE / cook-only, so consumers never need it).
      - name: Cache shaderc
        id: shaderc-cache
        uses: actions/cache@v4
        with:
          path: shaderc-install
          key: shaderc-v2024.3-${{ matrix.arch }}

      - name: Build shaderc (cache miss only)
        if: steps.shaderc-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v2024.3 https://github.com/google/shaderc shaderc-src
          ( cd shaderc-src && ./utils/git-sync-deps )
          cmake -S shaderc-src -B shaderc-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DSHADERC_SKIP_TESTS=ON -DSHADERC_SKIP_EXAMPLES=ON
          cmake --build shaderc-build
          DESTDIR="$PWD/shaderc-install" cmake --install shaderc-build

      - name: Install shaderc into /usr
        run: sudo cp -a shaderc-install/usr/. /usr/

      # jammy's libmeshoptimizer-dev is too old (no meshopt_simplify `options` param,
      # added in v0.18), and the code targets the current API (as vcpkg does on
      # Windows). Build a current version from source; static (the default), so it
      # bakes into asset.so/render.so — self-contained, no runtime dep.
      - name: Build & install meshoptimizer
        run: |
          git clone --depth 1 --branch v0.21 https://github.com/zeux/meshoptimizer meshopt-src
          cmake -S meshopt-src -B meshopt-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DMESHOPT_BUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build meshopt-build
          sudo cmake --install meshopt-build

      - name: Derive version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "extra=-DCPACK_PACKAGE_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        run: >
          cmake -S lux-engine -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DLUX_BUILD_EDITOR=OFF
          -DBUILD_TESTING=OFF
          ${{ steps.ver.outputs.extra }}

      - name: Build
        run: cmake --build build

      - name: Package
        run: cd build && cpack -G DEB --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: lux-engine-deb-${{ matrix.arch }}
          path: build/*.deb
          if-no-files-found: error

      - name: Attach .debs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Automated .deb build." 2>/dev/null || true
          gh release upload "$TAG" build/*.deb --repo "$GITHUB_REPOSITORY" --clobber

  notify-apt:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger lux-apt publish
        env:
          DISPATCH_TOKEN: ${{ secrets.LUX_APT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "LUX_APT_DISPATCH_TOKEN not set — skipping auto-publish."; exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/LUX-YU/lux-apt/dispatches \
            -d '{"event_type":"publish"}'
          echo "Triggered lux-apt publish."
