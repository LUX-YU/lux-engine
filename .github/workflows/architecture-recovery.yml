name: architecture-recovery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scene-feature-identity:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Scene Feature identity boundary
        run: python3 tools/architecture/check_scene_feature_identity.py

  persistent-entity-identity:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check persistent entity identity boundary
        run: python3 tools/architecture/check_persistent_entity_identity.py

  entity-section-boundary:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check EntitySection runtime boundary
        run: python3 tools/architecture/check_entity_section_boundary.py

  apply-reviewed-patch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect prepared patch
        id: patch
        shell: bash
        run: |
          if [[ -f .github/recovery/READY ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply prepared patch
        if: steps.patch.outputs.present == 'true'
        shell: bash
        run: |
          if compgen -G '.github/recovery/next.patch.gz.b64.part-*' > /dev/null; then
            cat .github/recovery/next.patch.gz.b64.part-* \
              | base64 --decode \
              | gzip --decompress > "$RUNNER_TEMP/next.patch"
          elif [[ -f .github/recovery/next.patch.gz.b64 ]]; then
            base64 --decode .github/recovery/next.patch.gz.b64 \
              | gzip --decompress > "$RUNNER_TEMP/next.patch"
          else
            cat .github/recovery/next.patch.part-* > "$RUNNER_TEMP/next.patch"
          fi

          git config user.name "OpenAI Architecture Agent"
          git config user.email "noreply@openai.com"
          git am "$RUNNER_TEMP/next.patch"
          git rm -f --ignore-unmatch \
            .github/recovery/READY \
            .github/recovery/next.patch.gz.b64 \
            .github/recovery/next.patch.gz.b64.part-* \
            .github/recovery/next.patch.part-*
          git commit --amend --no-edit
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  source-snapshot:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify checked-out revision
        run: |
          git status --short
          git rev-parse HEAD

      - name: Pack review worktree
        run: |
          tar \
            --exclude=.git \
            -czf "$RUNNER_TEMP/lux-engine-source.tar.gz" .
          cp "$RUNNER_TEMP/lux-engine-source.tar.gz" ./lux-engine-source.tar.gz

      - name: Upload review worktree
        uses: actions/upload-artifact@v4
        with:
          name: lux-engine-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: lux-engine-source.tar.gz
          if-no-files-found: error
          retention-days: 3
