version = 1

# Thresholds are qualification policy, not L0/L1 implementation constants.

[[relative]]
name = "World ReadQuery versus raw EnTT"
metric = "world_read_query"
baseline = "raw_entt_read"
size = 1000000
max_ratio = 1.05

